# Build the MkDocs site and publish it to GitHub Pages.
#
# One-time setup after this repo is on GitHub:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Then every push to main that touches the docs rebuilds and deploys the site.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

# Least privilege: read the repo, write Pages, mint the OIDC token deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install docs toolchain
        run: |
          uv venv
          uv pip install -r docs/requirements.txt
      - name: Build site
        run: uv run mkdocs build --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
