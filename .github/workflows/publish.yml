# Publish to PyPI on a version tag, via Trusted Publishing.
#
# There is no API token anywhere in this repo and there should never be one:
# PyPI mints a short-lived credential from the workflow's OIDC identity. Before
# the first release this needs a one-time setup on PyPI itself — see
# "Releasing" in the README. Until that exists, this workflow will fail at the
# publish step, which is the correct failure.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A tag is not a licence to skip the gates. If the suite is red, the
      # release does not happen.
      - name: Sync
        run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q

      - name: Refuse a tag that disagrees with pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: pypi          # gate the release behind an environment approval
    permissions:
      id-token: write          # the only credential; no PyPI token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
