[project]
# The distribution is `abox-cli`; everything user-facing stays `abox`. The bare
# name on PyPI is held by an unrelated 0.0.0 placeholder last touched in 2021.
# The command is `abox` (see [project.scripts]) and the import package is `abox`
# (see [tool.hatch.build.targets.wheel]) — do not rename either to match this.
name = "abox-cli"
version = "0.1.1"
description = "Sandboxed, network-restricted Claude Code environments with MCP access via Docker MCP Gateway"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tr0mb1r" }]
keywords = ["mcp", "docker", "sandbox", "devcontainer", "claude", "agent", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # macOS only today; Linux is scoped but not shipped (see GUIDE section 3).
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.scripts]
abox = "abox.cli:main"

[project.urls]
Homepage = "https://tr0mb1r.github.io/abox/"
Documentation = "https://tr0mb1r.github.io/abox/GUIDE/"
Repository = "https://github.com/tr0mb1r/abox"
Issues = "https://github.com/tr0mb1r/abox/issues"
Security = "https://github.com/tr0mb1r/abox/blob/main/SECURITY.md"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: test requires a live Docker daemon (deselect with '-m \"not docker\"')",
    "slow: test takes more than a few seconds",
]
addopts = "-ra --strict-markers -m 'not docker'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S603", # subprocess call - abox is a subprocess orchestrator by design
    "S607", # partial executable path - docker/op/devcontainer resolved via PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
